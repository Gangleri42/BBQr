name: Go
on:
  push:
    paths: ['go/**', 'test_data/shamir_vectors.json', '.github/workflows/go.yml']
  pull_request:
    paths: ['go/**', 'test_data/shamir_vectors.json', '.github/workflows/go.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: cmp shamir/testdata/vectors.json ../test_data/shamir_vectors.json
