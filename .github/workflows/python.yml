name: Python
on:
  push:
    paths: ['python/**', 'test_data/**', '.github/workflows/python.yml']
  pull_request:
    paths: ['python/**', 'test_data/**', '.github/workflows/python.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install -r requirements.txt
      - run: pytest tests
